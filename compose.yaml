# Retained PostgreSQL database for later migration/testing.
# The local MVP and automated tests use SQLite and do not require this service.
services:
  postgres:
    image: postgres:17
    container_name: Osyntra_IMDB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
