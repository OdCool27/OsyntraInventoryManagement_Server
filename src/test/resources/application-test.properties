# Tests never use .env, local MVP data, or PostgreSQL credentials.
spring.config.import=
osyntra.database=sqlite
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/osyntra-test-${random.uuid}.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.busy_timeout=10000
spring.datasource.hikari.data-source-properties.transaction_mode=IMMEDIATE
spring.flyway.locations=classpath:db/migration/sqlite
SENTRA_ADMIN_EMAIL=
SENTRA_ADMIN_PASSWORD=
osyntra.expiry.enabled=false
osyntra.bootstrap.enabled=false
